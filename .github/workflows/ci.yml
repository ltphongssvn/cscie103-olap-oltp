# .github/workflows/ci.yml
name: CI

# WHY push AND pull_request, WHICH LOOKS REDUNDANT
# pull_request checks the MERGE RESULT -- this branch merged into the base --
# which is what actually ships. push checks the branch as written. They disagree
# when the base moves underneath, and only the merge result gates the merge.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# LEAST PRIVILEGE AT THE WORKFLOW LEVEL. The default token is far broader than a
# gate needs, and GitHub's own guidance is to default GITHUB_TOKEN to read
# access only. This workflow reads code and repository metadata; it publishes
# nothing, comments on nothing, and writes no packages.
#
# contents: read IS SUFFICIENT FOR READING RULESETS, so the integration test
# that verifies branch protection needs no additional scope.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs on the same ref. A superseded run is checking code
  # nobody will merge.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # NAMED, AND THE NAME IS LOAD-BEARING. GitHub matches required status checks
    # by this exact string, and contracts/ruleset-develop-and-main.json requires
    # "quality gate". Renaming this job without renaming the required check
    # leaves a requirement that can never be satisfied, and GitHub does not warn
    # about it -- tests/test_ruleset.py compares the two for that reason.
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      # PINNED TO A COMMIT SHA, NOT A TAG. A tag is mutable -- the owner can
      # repoint v5 at any commit, so the workflow would run whatever code sits
      # behind that tag today. The comment carries the version so the pin stays
      # readable; the SHA is what executes. R006 enforces the SHA form.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # FULL HISTORY IS REQUIRED, NOT A PREFERENCE. The default is a shallow
          # clone of depth 1, and the secret scan walks every commit. Against a
          # shallow clone it reports clean while checking almost nothing -- a
          # gate that manufactures confidence, which is worse than no gate.
          fetch-depth: 0
          # actions/checkout persists GITHUB_TOKEN into .git/config by default,
          # where any later step can read it and any artifact can carry it off
          # the runner. Nothing here pushes or tags, so the credential has no
          # legitimate use after checkout.
          persist-credentials: false

      # A STALE LOCK IS THE STALENESS RISK THAT REMAINS. flake.lock pins one
      # nixpkgs revision and holds it forever unless someone updates it.
      #
      # fail-mode IS NOT OPTIONAL HERE. This action always exits 0 by default and
      # reports findings as a Markdown summary instead. A summary nobody reads is
      # not a gate.
      #
      # NOT A SCHEDULED update-flake-lock WORKFLOW. GitHub disables scheduled
      # workflows after 60 days without repository activity, and a successful
      # scheduled run does not itself count as activity. A refresh that silently
      # stops leaves a lock rotting while looking maintained.
      - uses: DeterminateSystems/flake-checker-action@fca8ac4a1791a59f5599f06b8dcf4c5bd7c8d53f
        with:
          fail-mode: true
          check-outdated: false
          condition: "numDaysOld < 30"

      # NIX ON THE RUNNER, WHICH REMOVES A WHOLE CLASS OF WORKAROUND. Without it
      # every gate needing a pinned tool would need a second installation path,
      # and CI would verify a toolchain nobody develops against.
      #
      # THE TAGGED ACTION, NOT nix-installer-action@main. That one uses the most
      # recent Determinate Nix even when the action itself is pinned, so a SHA
      # pin would describe the wrapper while the Nix underneath moved. This also
      # pins the one executable gates.py cannot get from the flake, since nix is
      # what BUILDS the flake's devShell.
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3

      # mise IS STILL NEEDED, BUT IT NO LONGER INSTALLS TOOLS. `mise run check`
      # is the gate and something must provide mise; the tools reach the task
      # through task_config, which enters the Nix devShell.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false

      # ONE COMMAND. ci.yml deliberately restates NOTHING about what `check`
      # contains -- listing the gates here would be a second source of truth for
      # a list that lives in gates.py, which R008 forbids.
      - name: mise run check
        run: mise run check
        env:
          # GH_TOKEN: the ruleset gate shells out to gh, which reads a keyring on
          # a laptop and this variable on a runner. Without it the gate died with
          # exit 4 -- "not authenticated" -- which reads like a missing ruleset
          # and is not.
          GH_TOKEN: ${{ github.token }}

          # DATABRICKS: three gates need a live workspace -- env parity, prereqs,
          # and the integration tests. On a laptop they use the DEFAULT profile
          # and an OAuth session in the OS keyring; a runner has neither.
          #
          # OAUTH M2M RATHER THAN OIDC, AND THAT IS A TIER LIMITATION, NOT A
          # PREFERENCE. Workload identity federation would need no secret at all,
          # but a federation policy is created against the ACCOUNT CONSOLE URL,
          # which Free Edition does not expose. See
          # docs/adr/0001-ci-authentication.md, which carries the migration
          # trigger for the day that changes.
          #
          # NOT SECRETS, DELIBERATELY IN THE CLEAR: the host names a workspace and
          # the client id is an OAuth client identifier -- a username. Hiding them
          # in the secret store would imply a sensitivity they do not have and
          # make the workflow harder to read.
          DATABRICKS_AUTH_TYPE: oauth-m2m
          # A RUNNER HAS NO .env, so the deploy supplies its own config here.
          # That is Twelve-Factor working as intended: one codebase, config
          # varying per environment -- not the same literal in two files.
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          LIGHTNING_STUDIO: ${{ vars.LIGHTNING_STUDIO }}
          LIGHTNING_TEAMSPACE: ${{ vars.LIGHTNING_TEAMSPACE }}
          DATABRICKS_CLIENT_ID: 72cd81b2-72dc-47fe-9a66-b238cb2b8330

          # THE ONLY SECRET. Bounded at 90 days, because a credential with no
          # expiry is one nobody rotates -- an expiring one keeps the rotation
          # path exercised.
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
