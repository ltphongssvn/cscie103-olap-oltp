# contracts/seed.yaml
#
# THE SEED, AS DATA RATHER THAN AS PYTHON LITERALS.
#
# It lived inside seed.py, where mutation testing rewrote names and shifted
# dates and no test could tell -- there is nothing to assert about an
# arbitrary fixture value except by restating it. Moving it here makes the
# distinction structural: this is data; seed.py is loading logic that can be
# tested, and is.
#
# VALIDATED AGAINST THE PANDERA CONTRACTS ON LOAD, so a malformed edit here
# fails exactly the way bad production data would.
#
# TWO LOADS, BECAUSE SCD2 NEEDS A BEFORE AND AN AFTER. `change` carries only
# what changed: a feed that resends unchanged rows versions everything.
