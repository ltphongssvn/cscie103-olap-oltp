# pyproject.toml
[project]
name = "cscie103-olap-oltp"
version = "0.1.0"
description = "OLTP (ER/3NF) to OLAP (dimensional) data platform, as code and as data"
# MUST MATCH .python-version AND THE BUNDLE'S environment_version.
# Spark Connect requires the client and server to share a Python MINOR version;
# a mismatch surfaces as "Python versions in the Spark Connect client and server
# are different" when a UDF dies, not when the change was made. The env-parity
# gate enforces the link.
requires-python = "==3.12.3"

# CONTRACT-FIRST, AND THESE ARE RUNTIME DEPENDENCIES RATHER THAN DEV TOOLS,
# because the contracts execute inside the pipeline, not only in the test suite.
#
#   pydantic   record-boundary validation. pydantic-core is Rust via pyo3, so
#              per-record validation at ingestion is cheap. It validates ONE
#              OBJECT AT A TIME and is not designed for table-scale checks --
#              which is why pandera is here too rather than instead.
#   pandera    DataFrame/table-boundary validation. One schema definition
#              validates across pandas and PySpark, so the same contract guards
#              a local unit test and a Spark job.
#
# THE TWO ARE NOT REDUNDANT. They guard different boundaries: pydantic answers
# "is this record well-formed", pandera answers "does this table satisfy its
# grain, nullability and statistical expectations".
dependencies = [
  "pydantic>=2.10",
  # THE BACKEND IS AN EXTRA, AND OMITTING IT FAILS LATE AND VAGUELY.
  #
  # pandera ships five validation backends -- pandas, pyspark, polars, ibis,
  # pyarrow -- and the documented practice is to install the extra for each one
  # you use. The bare package imports fine, so the omission surfaces as
  # "No module named 'pandas'" from a test file, naming neither pandera nor the
  # missing extra.
  #
  # PANDAS NOW, PYSPARK WHEN THE JOBS ARRIVE. The same DataFrameModel validates
  # both, so adding the pyspark extra later changes the dependency and not one
  # line of contract.
  "pandera[pandas]>=0.32",
  # AMBIENT PROCESS STATE, MADE A VALIDATED SNAPSHOT.
  #
  # THE PACKAGE ITSELF WAS MISSING HERE UNTIL NOW, WHICH IS WORTH RECORDING: an
  # earlier edit moved the JUSTIFICATION into this list and left the requirement
  # in the dev group. src/cscie103_olap_oltp/environment.py imports it at
  # runtime, so any install without dev extras would fail on import -- and no
  # gate could notice, because dev extras are always present locally and in CI.
  "pydantic-settings>=2.6",
  # THE VALIDATOR, BECAUSE PYDANTIC IS NOT ONE. Pydantic GENERATES JSON Schema
  # and does nothing to validate a schema against its metaschema or an instance
  # against a schema. Without this the published contract would be a document
  # nobody checks rather than something that can refuse a malformed artifact.
  "jsonschema>=4.23",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9",
  # REAL STUBS EXIST, SO USE THEM RATHER THAN SUPPRESSING THE IMPORT.
  #
  # The documented order is: check typeshed and PyPI for a stub package BEFORE
  # suppressing. The shortcut -- another ignore_missing_imports entry -- would
  # switch off type checking for every jsonschema call, and those calls are what
  # enforce the published artifact contract.
  "types-jsonschema>=4.23",
  # REAL STUBS AGAIN, SURFACED BY disallow_any_unimported.
  #
  # That setting exists to catch untyped Anys leaking into our own signatures,
  # and its first real find was here: every fixture returning a DataFrame
  # became Any. pandas ships pandas-stubs, so the answer is to install them
  # rather than add pandas to the ignore list and lose checking on every frame.
  "pandas-stubs>=2.2",
  # ARCHITECTURE ENFORCED BY A LIBRARY BUILT FOR IT, NOT BY CUSTOM ANALYSIS.
  #
  # The boundary rules below were nearly implemented as bespoke AST walking plus
  # Rego facts -- custom code doing a job an established tool already does,
  # which is the debt this repository refuses everywhere else. import-linter
  # compares real imports against declared contracts and fails the build.
  "import-linter>=2.11",
  # PII DETECTION BY CONTENT, NOT BY PATH.
  #
  # The structural controls -- .gitignore rules and the hygiene gate's extension
  # checks -- are proxies. They catch the realistic mistake and miss a data file
  # placed anywhere unexpected. This reads what is IN the file.
  #
  # The gap is not hypothetical: .gitignore excludes *.parquet and *.csv, while
  # an HTML export of an executed notebook carries the same names, birth dates
  # and salaries in its cell outputs and matches no rule at all.
  #
  # THE PROJECT LIVES UNDER data-privacy-stack/presidio NOW, not
  # microsoft/presidio. Same package name on PyPI.
  #
  # NOT presidio-cli, the obvious choice: it supports Python 3.8-3.10 and this
  # project is pinned to 3.12.3.
  "presidio-analyzer>=2.2.364",
  # en_core_web_sm, NOT the documented en_core_web_lg. The large model is ~560MB
  # against ~12MB, and this scans a repository that should contain no PII at all
  # -- recall on obvious entities is the requirement, not subtle disambiguation.
  #
  # PINNED BY URL rather than fetched with `spacy download`, so uv locks it like
  # any other dependency. A download at install time is a network call no
  # lockfile records, which is the reproducibility hole flake.lock and uv.lock
  # exist to close. AnalyzerEngine() with no arguments will otherwise DOWNLOAD
  # the large model on first run, ignoring whatever was pinned.
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# SRC LAYOUT, DECLARED. Tests import the INSTALLED package, so a test exercises
# what ships rather than what happens to be on sys.path.
[tool.hatch.build.targets.wheel]
packages = ["src/cscie103_olap_oltp"]

[tool.ruff]
target-version = "py312"
line-length = 100
# FIRST-PARTY CODE IS FOUND BY LOCATION, NOT BY AN ENUMERATION OF NAMES.
# known-first-party = [...] goes stale once per module added, and the failure is
# silent: imports sort as third-party until lint eventually says so.
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately broader than defaults. S is bandit: executed CODE gets checked,
# not only the data it processes.
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
# S101 forbids `assert` because Python strips asserts under -O, so an assert used
# as a runtime check silently disappears. That does not apply in a test file:
# asserts ARE the mechanism and pytest never runs optimized. S603/S607 are
# subprocess warnings, and proving a gate refuses something cannot be faked
# in-process; it has to shell out.
"tests/*.py" = ["S101", "S603", "S607"]
# THE TWO MODULES THAT ARE ALLOWED TO TOUCH THE RAW ENVIRONMENT, because each
# IS a boundary:
#   environment.py  hands the environment to pydantic, which parses, casts and
#                   validates it. Nothing else should re-implement that.
#   git/env.py      must see git's routing variables in order to REMOVE them;
#                   asking a settings model would defeat the purpose.
"src/cscie103_olap_oltp/environment.py" = ["TID251"]
"src/cscie103_olap_oltp/git/env.py" = ["TID251"]
# conftest reads the raw environment to strip it, for the same reason git/env
# does -- see the incident recorded in its docstring.
"tests/conftest.py" = ["S101", "S603", "S607", "TID251"]
# test_gitenv's SUBJECT is the raw environment: it proves the scrub removes
# routing variables, which cannot be asserted through a settings model that
# deliberately does not carry them.
"tests/test_gitenv.py" = ["S101", "S603", "S607", "TID251"]
# DATABRICKS NOTEBOOKS ARE A DIFFERENT DIALECT, SCOPED BY PATH.
#   F821  spark, dbutils and display are INJECTED BY THE RUNTIME. No import
#         exists or can exist.
#   E402  a notebook is cells, not a module. Imports belong in the cell that
#         introduces them.
#   N812  `from pyspark.sql import functions as F` is the universal convention.
#   S101  asserts are the checking mechanism, and a job never runs under -O.
"notebooks/*.py" = ["F821", "E402", "N812", "S101"]

# --- Configuration is read at one boundary, by a library built for it ---------
#
# PYDANTIC PARSES, CASTS AND VALIDATES THE ENVIRONMENT. Reading os.environ at a
# call site re-implements that per caller, and this repository already paid for
# it: `os.environ.get("CI", "").lower() in {"true", "1"}` existed in four
# modules, each spelled slightly differently, and none of them would have
# accepted "True" without the lowercase call nobody remembered to add.
#
# ENFORCED BY RUFF RATHER THAN BY REVIEW. TID251 checks that specific module
# MEMBERS are not imported or accessed, which is precisely the granularity this
# rule needs -- import-linter forbids whole modules and cannot express it, and
# writing an AST walker to do it would be the custom code this rule exists to
# forbid.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read configuration through cscie103_olap_oltp.environment, which lets pydantic parse, cast and validate it."
"os.getenv".msg = "Read configuration through cscie103_olap_oltp.environment, which lets pydantic parse, cast and validate it."

[tool.mypy]
python_version = "3.12"
strict = true
# Notebooks are excluded for the same reason F821 is disabled for them: spark,
# dbutils and display have no importable types, so every cell would report
# errors describing the checker's model rather than the code.
exclude = ["notebooks/.*"]

# --- Fail closed --------------------------------------------------------------
# strict = true is not the ceiling. These turn silence into failure.
#
# warn_unused_configs   a section matching no file is a config that stopped
#                       applying when something moved.
# warn_unreachable      unreachable code is either dead or a wrong type guard.
# ignore-without-code   a bare `# type: ignore` suppresses EVERY error on that
#                       line, including ones added later.
# possibly-undefined    a name assigned only inside a branch, read outside it.
# redundant-expr        a condition always true or always false, which is how a
#                       rule ends up dead while its tests still pass.
warn_unused_configs = true
warn_unreachable = true
# THE GUARD FOR THE SUPPRESSIONS THAT REMAIN.
#
# ignore_missing_imports silences the IMPORT, but every value from that library
# then becomes Any -- and an Any flowing into one of our own signatures makes
# that function unchecked without anything saying so. This is the documented
# protection against exactly that consequence, and it applies to the four
# libraries below that genuinely ship no stubs.
disallow_any_unimported = true
enable_error_code = [
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
]

# pandera, pyspark, presidio and spacy ship incomplete or absent stubs. Without
# this, strict mode reports an error per import for libraries whose types are not
# this project's concern -- and a blanket ignore_errors would hide real problems
# in our own code.
[[tool.mypy.overrides]]
module = ["pandera.*", "pyspark.*", "presidio_analyzer.*", "spacy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# MARKERS ARE REGISTERED, AND UNREGISTERED ONES ARE AN ERROR.
markers = [
  "integration: requires network and credentials; excluded from the default run",
  "spark: requires a local or remote Spark session; slower than a unit test",
]

# --- Fail closed --------------------------------------------------------------
# --strict-markers   a typo'd marker is an ERROR, not a silently-created new one.
#                    Without it @pytest.mark.integraton runs in the default
#                    suite forever and nobody notices.
# --strict-config    an unknown ini key is an error rather than ignored. A
#                    misspelled option that does nothing looks exactly like one
#                    that works.
# -ra                report the reason for every non-passing outcome. A skip
#                    nobody sees is a test that stopped running.
# -m not integration the default run is HERMETIC, so it can sit behind a git
#                    hook. A hook needing credentials is a hook people bypass.
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not integration"]

# An xfail that PASSES is a failure. Otherwise a fixed bug leaves its xfail in
# place forever and the suite reports success for a test asserting nothing.
xfail_strict = true


# --- Architecture as Code ------------------------------------------------------
#
# TWO TOOLS, BECAUSE THE RULES LIVE AT TWO LEVELS. Forcing one to do both would
# mean hand-rolling the half it cannot express.
#
#   ruff TID251     an ATTRIBUTE path:  os.environ
#   import-linter   a MODULE dependency: environment must not import cloud
#
# THE FIRST ATTEMPT CONFLATED THEM AND THE TOOL SAID SO. It asked import-linter
# to forbid `os` outright, which broke instantly: ledger imports os for fsync,
# and four modules reached os INDIRECTLY through git.env -- the very boundary
# that is supposed to own it. Forbidding a module cannot mean "not this one
# attribute", and pretending otherwise would have needed an allowlist per caller.
[tool.importlinter]
root_package = "cscie103_olap_oltp"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "config-boundary"
name = "The settings boundary depends on nothing above it"
type = "forbidden"
# environment.py IS THE BOTTOM OF THE STACK. If it imported a module that reads
# configuration, construction would recurse -- and the failure would surface as
# an import error far from its cause.
source_modules = ["cscie103_olap_oltp.environment"]
forbidden_modules = [
  "cscie103_olap_oltp.cloud",
  "cscie103_olap_oltp.databricks",
  "cscie103_olap_oltp.catalog",
  "cscie103_olap_oltp.identity",
  "cscie103_olap_oltp.gates",
]

[[tool.importlinter.contracts]]
id = "contracts-are-pure"
name = "Published contracts do not depend on the platform that emits them"
type = "forbidden"
# A CONSUMER IMPORTS THESE MODELS WITHOUT THIS PLATFORM. If the contract package
# reached into gates or cloud, the published schema would carry a dependency on
# machinery no reader has.
source_modules = ["cscie103_olap_oltp.contracts.verdict"]
forbidden_modules = [
  "cscie103_olap_oltp.cloud",
  "cscie103_olap_oltp.databricks",
  "cscie103_olap_oltp.gates",
  "cscie103_olap_oltp.ledger",
]
