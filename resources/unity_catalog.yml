# resources/unity_catalog.yml
# The Unity Catalog objects this project owns.
#
# EVERYTHING HERE IS FULLY MANAGED BY THE BUNDLE, which is a stronger claim than
# it sounds. A declared schema is created or DROPPED by the bundle -- there is no
# grant-only mode for UC objects -- so declaring an object that holds real work
# puts a destructive plan one `bundle destroy` away from it. Only objects this
# project creates from scratch appear below.
#
# THE SIBLING PROJECT'S OBJECTS ARE NOT DECLARED HERE AND MUST NEVER BE. Free
# Edition shares one workspace and one metastore between projects, so the
# catalog is the only isolation boundary available; a resource pointing across
# it would put another project's data under this bundle's destroy plan.
#
# A COMMENT FIELD IS A DEPLOYED VALUE, NOT PROSE, and that distinction cost a
# test. An earlier version of the catalog comment below named the sibling
# catalog to explain the isolation -- and the isolation test, which searches the
# RESOLVED bundle, found that name and failed. The test was right: it cannot
# distinguish a name in a description from a name in a catalog_name, and it
# should not try. Explanation lives in these `#` comments, which never reach the
# workspace; `comment:` says only what the object is.

resources:
  catalogs:
    # THE ISOLATION BOUNDARY, OWNED AS CODE. Catalogs are a bundle resource type
    # on the direct deployment engine, but `bundle bind` cannot adopt existing
    # Unity Catalog catalogs -- so a declared catalog is always CREATED, and
    # declaring one that already exists is an unresolvable conflict. This one
    # does not exist yet, which makes now the only moment it can be owned.
    project:
      name: ${var.catalog}
      comment: OLTP-to-OLAP demonstration platform.

  schemas:
    # TWO SCHEMAS, BECAUSE THE PROJECT'S WHOLE POINT IS THAT THESE ARE DIFFERENT
    # MODELLING DISCIPLINES. Keeping normalised sources and the dimensional
    # model in one schema would blur exactly the distinction being demonstrated,
    # and would make "which layer is this table in" a naming convention rather
    # than a structural fact.
    #
    # THE OWNER OF A SCHEMA RESOURCE IS ALWAYS THE DEPLOYING USER and cannot be
    # changed; run_as is ignored for schema operations. Recorded because it is a
    # documented limitation, not something to discover during a prod deploy.
    oltp:
      # THE CATALOG COMES FROM THE RESOURCE, NOT THE VARIABLE, so the bundle
      # knows this schema DEPENDS ON the catalog and orders creation
      # accordingly. ${var.catalog} would name the same string while hiding the
      # dependency, and the deploy would race.
      catalog_name: ${resources.catalogs.project.name}
      # THE PLAIN NAME, NOT ${var.schema_prefix} prepended. The CLI adds its own
      # prefix in development mode; interpolating it here too produces
      # dev_user_dev_user_oltp.
      name: ${var.oltp_schema}
      comment: >-
        Normalised source side. Third normal form, entity-relationship modelled,
        application oriented -- the shape an operational system writes.

    olap:
      catalog_name: ${resources.catalogs.project.name}
      name: ${var.olap_schema}
      comment: >-
        Dimensional side. Star schema, subject oriented, historical and
        consolidated -- the shape analytical queries read.

  volumes:
    # RAW LANDING, UNDER THE OLTP SCHEMA. Source extracts arrive here before any
    # transformation, so the volume belongs with the side that produces them.
    #
    # A MANAGED VOLUME, NOT EXTERNAL. An external volume needs a storage
    # credential and an external location, and Free Edition has neither; a
    # managed volume uses the metastore's own storage and needs no cloud setup.
    raw:
      catalog_name: ${resources.catalogs.project.name}
      schema_name: ${resources.schemas.oltp.name}
      name: raw
      volume_type: MANAGED
      comment: Landing zone for raw source extracts, before any transformation.
